<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Electron warns about a missing policy and falls back to an insecure one.
      `unsafe-inline` for styles is required because Vuetify injects its
      component styles at runtime, and `ws:` lets the Vite dev server reconnect
      for hot reload.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:"
    />
    <title>Vutron</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="./main"
    ></script>
  </body>
</html>
