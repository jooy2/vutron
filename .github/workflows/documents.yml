name: documents

on:
  # run every time a push occurs in the docs folder
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
  # trigger deployment manually
  workflow_dispatch:

jobs:
  build-documentation-pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0

      # Caches the npm download cache (~/.npm), scoped to the docs lockfile.
      # Do not cache `node_modules` here: the key would collide with app-test,
      # which installs only the root dependencies, and `npm install` would then
      # be skipped while `docs/node_modules` is missing.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # run build script
      - name: Build VitePress site
        run: npm run build

      # please check out the docs of the workflow for more details
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # deploy to gh-pages branch
          target_branch: gh-pages
          # deploy the default output dir of VitePress
          build_dir: docs/dist
          jekyll: false
          fqdn: 'vutron.cdget.com'
        env:
          # @see https://docs.github.com/en/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
